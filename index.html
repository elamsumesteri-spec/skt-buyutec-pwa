<style>
  :root{
    --bg:#f2f4f7; --surface:#ffffff; --surface2:#eef1f5; --surface3:#e2e7ee; --line:#dde3ea;
    --text:#171b22; --muted:#69707d; --amber:#2563eb; --amber-dim:#dbe7fb; --amber-rgb:37,99,235; --amber-light:var(--amber-light); --amber-dark:var(--amber-dark); --amber-hover:#3b7ddb; --steel:#2f6da6; --steel-rgb:47,109,166; --red:#d8342a; --green:#1f8a5f;
    --shadow-sm:0 2px 6px rgba(23,27,34,.06);
    --shadow-md:0 10px 24px rgba(23,27,34,.10);
    --shadow-lg:0 24px 54px rgba(23,27,34,.16);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden; touch-action:manipulation;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; touch-action:manipulation;}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none;}
  img{max-width:100%; display:block;}
  ::selection{background:var(--amber); color:#fff;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .hex{clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); display:flex; align-items:center; justify-content:center;}

  .wrap{max-width:1280px; margin:0 auto; padding:0 24px;}
  .announce{background:linear-gradient(90deg,var(--amber),var(--amber-light)); color:#fff; font-size:13px; font-weight:700; padding:10px 0; overflow:hidden; white-space:nowrap; position:relative;}
  .announce-track{display:inline-flex; align-items:center; animation:announceScroll 18s linear infinite;}
  .announce:hover .announce-track{animation-play-state:paused;}
  .announce-track span{padding:0 40px; display:inline-block;}
  @keyframes announceScroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}
  header.site{position:sticky; top:0; z-index:40; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);}
  .header-row{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; gap:20px; flex-wrap:wrap;}
  .logo{display:flex; align-items:center; gap:11px; font-size:21px; font-weight:700; cursor:pointer;}
  .logo .hex{width:36px; height:36px; background:linear-gradient(145deg,var(--amber),var(--amber-dark)); color:#fff; font-weight:700; font-size:14px; box-shadow:0 6px 16px rgba(var(--amber-rgb),.30);}
  .search-box{flex:1; min-width:200px; max-width:420px; display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--line); border-radius:6px; padding:10px 14px; transition:.15s;}
  .search-box:focus-within{border-color:var(--steel); box-shadow:0 0 0 3px rgba(var(--steel-rgb),.12);}
  .search-box input{background:none; border:none; color:var(--text); font-size:14px; width:100%; outline:none;}
  .search-box .clear-x{background:none; color:var(--muted); font-size:13px; opacity:.7;}
  .search-box .clear-x:hover{opacity:1; color:var(--red);}
  .search-box.compact{flex:0 0 auto; width:240px; max-width:240px; min-width:0; padding:9px 12px; border-radius:21px; animation:searchGrow .18s ease both;}
  .search-box.compact svg{width:16px; height:16px; stroke:var(--muted); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}
  @keyframes searchGrow{from{width:42px; opacity:.4;} to{width:240px; opacity:1;}}
  .icon-btn.ico-search{color:var(--steel);}
  .icon-btn.ico-search:hover{background:var(--steel); border-color:var(--steel); color:#fff;}
  .header-actions{display:flex; align-items:center; gap:8px;}

  // ÖNEMLİ DÜZELTME: burada yanlışlıkla sadece startOrderWatcher() (katalog/ürün
  // değişikliklerini dinleyen fonksiyon — adı yanıltıcı ama SİPARİŞLERİ dinlemiyor)
  // çağrılıyordu. Asıl yeni siparişleri dinleyip bildirim tetikleyen dinleyici
  // startOrdersColWatcher() idi ve bu satırda hiç çağrılmıyordu. Sayfa ilk açıldığında
  // (loadData içinde) ikisi de zaten başlatılıyor olsa da, dinleyici herhangi bir
  // sebeple (hata, bağlantı kopması) durmuşsa "Bildirimleri Aç" butonuna basmak onu
  // yeniden BAŞLATMIYORDU — bu da "izin verdim ama bildirim hiç gelmiyor" sorununa
  // yol açıyordu. Şimdi ikisi de burada yeniden başlatılıyor.
  startOrderWatcher();
  startOrdersColWatcher();
  render();
  showToast('Bildirimler bu tarayıcıda açıldı');
}

// Bir ürünün stoğu satış sırasında sıfıra düştüğünde admine anlık tarayıcı bildirimi
// gönderir (sipariş bildirimleriyle aynı izin/altyapıyı kullanır). Ayrıca admin
// panelindeki "Stokta Yok" etiketi ve Genel Bakış'taki sayaç KALICI olarak bu bilgiyi
// gösterir — admin bildirimi kaçırsa bile panelde görür.
function fireStockOutNotification(productName){
  if(!notifSupported() || Notification.permission!=='granted') return;
  try{
    const n = new Notification('⚠️ Stok Tükendi', { body: productName + ' stokta kalmadı.', tag:'stockout-'+productName });
    n.onclick = function(){ window.focus(); };

function notifyNewOrders(orders){
  if(!orders.length) return;
  const latestId = orders[0].id;
  if(NOTIF.enabled && latestId !== NOTIF.lastOrderId){
    if(NOTIF.lastOrderId){
      const idx = orders.findIndex(o=>o.id===NOTIF.lastOrderId);
      const newOnes = idx===-1 ? [orders[0]] : orders.slice(0, idx);
      newOnes.slice().reverse().forEach(o=>fireOrderNotification(o));
    } else {
      // Bildirimler sıfır sipariş varken etkinleştirilmiş (lastOrderId hiç kaydedilmemiş) —
      // bu durumda "hangi siparişlerden beri yeni" hesaplanamaz, o yüzden en yeni siparişi
      // doğrudan bildiriyoruz ki ilk gelen gerçek sipariş asla atlanmasın.
      fireOrderNotification(orders[0]);
    }
  }
  if(NOTIF.enabled){
    NOTIF.lastOrderId = latestId;
    localStorage.setItem('kdr-notif-last-order', latestId);
  }
}
let lastCatalogCompareJson = null;
function catalogComparable(d){
  const c = Object.assign({}, d);
  delete c.orders; // siparişler ayrı senkronize edilir, katalog karşılaştırmasına dahil edilmez
  return JSON.stringify(c);
}
function handleFreshStoreSnapshot(fresh){
  // Gelen veri, şu an ekranda olanla birebir aynıysa (ör. bu sekmenin kendi yazdığı veri
  // geri yankılandıysa) hiçbir şey yapma — gereksiz yere sayfayı tekrar tekrar çizip
  // "titremeye" (birden fazla kez tepki vermeye) sebep olmasın.
  const freshJson = catalogComparable(fresh);
  if(freshJson === lastCatalogCompareJson) return;
  lastCatalogCompareJson = freshJson;
  const active = document.activeElement;
  const isTyping = active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA') && document.body.contains(active);
  if(!isTyping && !ADMIN.editingProduct){
    const keepOrders = DATA.orders; // siparişler kendi kanalından geliyor, burada korunur
    DATA = fresh;
    DATA.orders = keepOrders;
    normalizeData();
    render();
  }
}
let unsubscribeOrders = null;
async function refreshCatalogFromFirestore(){
  try{
    const res = await storageGet(STORAGE_KEY, true);
    if(res && res.value){
      const fresh = JSON.parse(res.value);
      handleFreshStoreSnapshot(fresh);
    }
  }catch(e){ console.error('Katalog yenileme hatası', e); }
}
async function startOrderWatcher(){
  if(unsubscribeOrders){ unsubscribeOrders(); unsubscribeOrders=null; }
  if(!firebaseReady || !storeDocRef) return;
  await firebaseAuthReadyPromise;
  // Katalog verisi (ürün/hero/promo/kategori) birden fazla küçük dokümana bölündüğü için,
  // bunlardan HERHANGİ biri değişince tam ve doğru birleşmiş veriyi almak üzere
  // storageGet() ile hepsini birlikte yeniden okuyoruz. Kısa süre içinde art arda gelen
  // değişiklikleri (ör. aynı kaydetme işleminin birden fazla dokümanı tetiklemesi) TEK bir
  // yenilemede topluyoruz (debounce) — böylece sayfa arka arkaya birkaç kez yeniden
  // çizilmiyor.
  let debounceTimer = null;
  const onAnyChange = function(){
    if(debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(refreshCatalogFromFirestore, 400);
  };
  const onErr = function(err){ console.error('Firestore dinleme hatası', err); };
  const u1 = storeDocRef.onSnapshot(onAnyChange, onErr);
  const u2 = heroDocRef.onSnapshot(onAnyChange, onErr);
  const u3 = promosDocRef.onSnapshot(onAnyChange, onErr);
  const u4 = categoriesDocRef.onSnapshot(onAnyChange, onErr);
  unsubscribeOrders = function(){ u1(); u2(); u3(); u4(); if(debounceTimer) clearTimeout(debounceTimer); };
}

/* ---------- siparişler: ürün/görsel verisinden TAMAMEN AYRI, kendi küçük koleksiyonunda
   (kdr_orders) tutulur. Böylece ürün fotoğrafları büyüyüp ana dokümanı (kdr_store/main)
   1MB sınırının üzerine çıkarsa bile, siparişler bundan etkilenmeden anında senkronize
   olmaya devam eder — sipariş senkronizasyonu, katalog senkronizasyonuna bağımlı değildir. ---------- */
function orderForSync(order){
  // Sipariş içindeki ürün görseli, eğer yerelde base64 olarak sıkıştırılmışsa (http ile
  // başlamıyorsa) burada atılır — sipariş dokümanını küçük ve senkronizasyonu garanti tutmak
  // için. Barkod/https görsel adresleri (Firebase Storage / Vercel Blob) korunur.
  return Object.assign({}, order, {
    items: (order.items||[]).map(i => Object.assign({}, i, { image: (i.image && /^https?:\/\//.test(i.image)) ? i.image : '' }))
  });
}
let unsubscribeOrdersCol = null;
async function startOrdersColWatcher(){
  if(unsubscribeOrdersCol){ unsubscribeOrdersCol(); unsubscribeOrdersCol=null; }
  if(!firebaseReady || !ordersColRef) return;
  await firebaseAuthReadyPromise;
  unsubscribeOrdersCol = ordersColRef.orderBy('date','desc').limit(500).onSnapshot(function(snap){
    const incoming = snap.docs.map(d=>d.data());
    mergeIncomingOrders(incoming);
  }, function(err){ console.error('Sipariş koleksiyonu dinleme hatası', err); });
}
let ordersRenderTimer = null;
function mergeIncomingOrders(incoming){
  if(!DATA) return;
  if(!DATA.orders) DATA.orders = [];
  const byId = {};
  DATA.orders.forEach(o=>{ byId[o.id]=o; });
  incoming.forEach(o=>{ byId[o.id]=o; });
  const merged = Object.values(byId).sort((a,b)=> new Date(b.date) - new Date(a.date));
  // Not: sadece ID listesini değil, sipariş içeriğini (özellikle "status" alanını) de
  // karşılaştırıyoruz. Aksi halde bir sipariş sadece "onaylandı"/"hazır" olarak
  // güncellendiğinde (yeni sipariş eklenmediği/silinmediği için) ID listesi aynı kalır ve
  // bu değişiklik diğer sekmelere/cihazlara (müşterinin ekranı dahil) hiç yansımaz.
  const changed = JSON.stringify(merged) !== JSON.stringify(DATA.orders);
  if(!changed) return;
  const idsChanged = JSON.stringify(merged.map(o=>o.id)) !== JSON.stringify(DATA.orders.map(o=>o.id));
  if(idsChanged) notifyNewOrders(merged);
  DATA.orders = merged;
  // Çok sayıda sipariş çok kısa sürede (arka arkaya) gelirse, Firestore her birinde ayrı
  // bir bildirim tetikler; her seferinde tüm sayfayı yeniden çizmek (render()) tarayıcıyı
  // kilitleyebilir. Bu yüzden art arda gelen olayları 500ms içinde TEK bir yeniden çizime
  // topluyoruz (debounce) — bildirimler yine anında gelir, sadece ekran güncellemesi
  // gruplanır.
  if(ordersRenderTimer) clearTimeout(ordersRenderTimer);
  ordersRenderTimer = setTimeout(function(){
    ordersRenderTimer = null;
    try{ localStorage.setItem('kdr_shared_'+STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
    const active = document.activeElement;
    const isTyping = active && (active.tagName==='INPUT'||active.tagName==='TEXTAREA') && document.body.contains(active);
    // Sipariş verisi, mağaza vitrininde (ürün listesi/banner) hiçbir şeyi etkilemiyor —
    // sadece admin panelinde veya müşterinin "Siparişlerim" sekmesinde görünüyor. O yüzden
    // müşteri şu an alışveriş yapıyorsa (vitrinde geziniyorsa) sırf arka planda yeni bir
    // sipariş geldi diye tüm sayfayı (banner animasyonu dahil) yeniden çizip
    // "titretmiyoruz" — veri zaten güncellendi, ilgili sekmeye gidildiğinde doğru
    // görünecek. Sadece gerçekten sipariş verisini gösteren bir ekran açıksa yeniden çiziyoruz.
    const ordersRelevantViewOpen = ADMIN.open || (ACCOUNT.open && ACCOUNT.tab==='siparisler');
    if(!isTyping && !ADMIN.editingProduct && ordersRelevantViewOpen){ render(); }
  }, 500);
}
async function syncOrderToFirestore(order){
  if(!firebaseReady || !ordersColRef) return;
  try{
    await firebaseAuthReadyPromise;
    await ordersColRef.doc(order.id).set(orderForSync(order));
  }catch(e){ console.error('Sipariş senkronizasyon hatası', e); }
}
async function deleteOrderFromFirestore(id){
  if(!firebaseReady || !ordersColRef) return;
  try{
    await firebaseAuthReadyPromise;
    await ordersColRef.doc(id).delete();
  }catch(e){ console.error('Sipariş silme senkronizasyon hatası', e); }
}
async function clearAllOrdersFromFirestore(){
  if(!firebaseReady || !ordersColRef) return;
  try{
    await firebaseAuthReadyPromise;
    const db = firebase.firestore();
    const snap = await ordersColRef.get();
    let batch = db.batch();
    let opCount = 0;
    for(const d of snap.docs){
      batch.delete(d.ref); opCount++;
      if(opCount>=400){ await batch.commit(); batch = db.batch(); opCount=0; }
    }
    if(opCount>0) await batch.commit();
  }catch(e){ console.error('Tüm siparişleri silme hatası', e); }
}


const CAT_ICONS = { kamera:'📹', kayit:'🖥️', harddisk:'💾', sunucu:'🗄️', yangin:'🔥', switch:'🔌' };
const CAT_COLORS = { kamera:'#e6eef7', kayit:'#eaeef2', harddisk:'#fdecec', sunucu:'#e9eef1', yangin:'#fdeee0', switch:'#e8f2ec' };

function uuid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2); }

/* ---------- storage: paylaşımlı veri (ürünler/siparişler/ayarlar) Firebase Firestore'da
   tek bir dokümanda tutuluyor — böylece hangi cihazdan/tarayıcıdan sipariş verilirse
   verilsin, yönetim paneli ve bildirim sistemi bunu anında görebiliyor. Sepet
   (shared:false) hâlâ sadece o ziyaretçinin kendi tarayıcısında, localStorage'da
   tutuluyor (paylaşılmasına gerek yok). window.storage varsa (Claude önizlemesi) o
   önceliklidir; yoksa Firestore denenir; o da başarısız olursa (ör. henüz
   firebaseConfig doldurulmadıysa) localStorage'a düşer. ---------- */
async function storageGet(key, shared){
  try{
    if(window.storage && typeof window.storage.get==='function'){
      const r = await window.storage.get(key, shared);
      if(r) return r;
    }
  }catch(e){ /* devam et */ }
  if(shared && firebaseReady && storeDocRef){
    try{
      await firebaseAuthReadyPromise;
      if(key === STORAGE_KEY && productsColRef){
        // Katalog verisi Firestore'da bölünmüş halde tutuluyor: ürünler kendi
        // koleksiyonunda (kdr_products, ürün başına 1 doküman), hero/promo/kategori
        // her biri kendi küçük dokümanında, geri kalanı (logo/ayarlar/müşteriler)
        // ana dokümanda. Burada hepsini birleştirip tek bir DATA nesnesi gibi
        // geri döndürüyoruz.
        const [mainSnap, heroSnap, promosSnap, catSnap, prodSnap] = await Promise.all([
          storeDocRef.get(), heroDocRef.get(), promosDocRef.get(), categoriesDocRef.get(), productsColRef.get()
        ]);
        if(mainSnap.exists && mainSnap.data().value){
          const obj = JSON.parse(mainSnap.data().value);
          obj.products = prodSnap.docs.map(d=>d.data());
          if(heroSnap.exists && heroSnap.data().value) obj.hero = JSON.parse(heroSnap.data().value);
          if(promosSnap.exists && promosSnap.data().value) obj.promos = JSON.parse(promosSnap.data().value);
          if(catSnap.exists && catSnap.data().value) obj.categories = JSON.parse(catSnap.data().value);
          return { key, value: JSON.stringify(obj), shared };
        }
      } else {
        const snap = await storeDocRef.get();
        if(snap.exists){
          const val = snap.data().value;
          if(val) return { key, value:val, shared };
        }
      }
    }catch(e){ console.error('Firestore okuma hatası', e); }
  }
  try{
    const raw = localStorage.getItem((shared?'kdr_shared_':'kdr_local_')+key);
    return raw!=null ? {key, value:raw, shared} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared, opts){
  let ok = false;
  let cloudError = null;
  try{
    if(window.storage && typeof window.storage.set==='function'){
      const r = await window.storage.set(key, value, shared);
      if(r) ok = true;
    }
  }catch(e){ /* devam et */ }
  if(shared && firebaseReady && storeDocRef){
    try{
      await firebaseAuthReadyPromise;
      if(opts && opts.light && key === STORAGE_KEY){
        // HAFİF KAYIT: sadece ana belge (müşteriler, ayarlar vb.) yazılır. Ürünlerin tamamını
        // Firestore'dan okuyup yeniden yazmaz; kayıt ol gibi işlemler bu yüzden anında biter.
        const objL = JSON.parse(value);
        const restL = Object.assign({}, objL);
        delete restL.products; delete restL.orders; delete restL.hero; delete restL.promos; delete restL.categories;
        await storeDocRef.set({ value: JSON.stringify(restL), updatedAt: Date.now() });
      } else if(key === STORAGE_KEY && productsColRef){
        // Katalog verisini böl: ürünler kendi küçük dokümanlarına (her ürün için 1
        // doküman), hero/promo/kategori her biri kendi küçük dokümanına, geri kalanı
        // (siparişler HARİÇ — onlar zaten ayrı koleksiyonda) ana dokümana yazılır.
        // Böylece kaç ürün/fotoğraf olursa olsun, tek bir doküman asla Firestore'un
        // 1MB sınırına yaklaşmaz.
        const obj = JSON.parse(value);
        const products = obj.products || [];
        const hero = obj.hero;
        const promos = obj.promos;
        const categories = obj.categories;
        const rest = Object.assign({}, obj);
        delete rest.products; delete rest.orders; delete rest.hero; delete rest.promos; delete rest.categories;
        const db = firebase.firestore();
        const existingSnap = await productsColRef.get();
        const existingIds = new Set(existingSnap.docs.map(d=>d.id));
        const currentIds = new Set(products.map(p=>String(p.id)));
        let batch = db.batch();
        let opCount = 0;
        for(const p of products){
          batch.set(productsColRef.doc(String(p.id)), p);
          opCount++;
          if(opCount>=400){ await batch.commit(); batch = db.batch(); opCount=0; }
        }
        for(const id of existingIds){
          if(!currentIds.has(id)){ batch.delete(productsColRef.doc(id)); opCount++; if(opCount>=400){ await batch.commit(); batch = db.batch(); opCount=0; } }
        }
        if(opCount>0) await batch.commit();
        // ÖNEMLİ: ürün koleksiyonundaki değişiklikler (ekleme/silme) Firestore'a TAMAMEN
        // yazılıp bittikten SONRA ana/hero/promo/kategori dokümanlarını yazıyoruz. Bu
        // dokümanlardaki her değişiklik canlı dinleyicileri (onSnapshot) anında tetikler
        // ve dinleyici tüm veriyi (ürünler dahil) Firestore'dan yeniden okur. Eğer bu
        // dokümanlar ürün yazımından ÖNCE yazılsaydı, dinleyici ürün silme/ekleme henüz
        // işlenmeden tetiklenir, eski (silinmemiş) ürün listesini geri getirip ekrandaki
        // güncel hâlin üzerine yazardı — silinen bir ürünün "geri gelmesi" tam olarak bu
        // yüzden oluyordu.
        await Promise.all([
          storeDocRef.set({ value: JSON.stringify(rest), updatedAt: Date.now() }),
          heroDocRef.set({ value: JSON.stringify(hero||{}), updatedAt: Date.now() }),
          promosDocRef.set({ value: JSON.stringify(promos||[]), updatedAt: Date.now() }),
          categoriesDocRef.set({ value: JSON.stringify(categories||[]), updatedAt: Date.now() })
        ]);
      } else {
        await storeDocRef.set({ value: value, updatedAt: Date.now() });
      }
      ok = true;
    }catch(e){ console.error('Firestore yazma hatası', e); cloudError = e; }
  }
  try{
    localStorage.setItem((shared?'kdr_shared_':'kdr_local_')+key, value);
    ok = true;
  }catch(e){ /* storage full or unavailable */ }
  return ok ? {key, value, shared, cloudError} : null;
}

function defaultData(){
  function p(name,cat,price,sale,isNew,feat,onSale){
    return { id:uuid(), name, category:cat, price, salePrice:sale||null, image:'',
      isNew: !!isNew, featured: !!feat, onSale: !!(sale||onSale) };
  }
  return {
    siteName: '5S Tech',
    currency: 'TRY', // 'TRY' veya 'USD' — sitenin o an hangi para biriminde SATIŞ yaptığı.
    usdRate: 44.5,   // 1 USD = ? TL. Fiyatlar her zaman TL olarak girilir/saklanır;

function normalizeData(){
  // Kritik güvence: DATA'nın ana dizileri (bir Firestore parçası henüz gelmediyse veya
  // eski/eksik bir önbellek okunduysa bile) HER ZAMAN dizi olsun — aksi halde
  // homeView/render "Cannot read properties of undefined" hatasıyla tüm siteyi
  // beyaz ekrana düşürüyordu.
  if(!Array.isArray(DATA.products)) DATA.products = (defaultData().products);
  if(!Array.isArray(DATA.categories)) DATA.categories = (defaultData().categories);
  DATA.categories.forEach(c=>{ if(!Array.isArray(c.subs)) c.subs = []; });
  if(!Array.isArray(DATA.promos)) DATA.promos = [];
  if(!DATA.hero) DATA.hero = defaultData().hero;
  if(DATA.hero && !DATA.hero.images){ DATA.hero.images = DATA.hero.image ? [DATA.hero.image] : []; }
  if(DATA.hero && /^[0-9]+$/.test((DATA.hero.discount||'').trim())){ DATA.hero.discount = '%' + DATA.hero.discount.trim(); }
  if(DATA.hero && !DATA.hero.discountLabel){ DATA.hero.discountLabel = 'İNDİRİM'; }
  if(DATA.hero && DATA.hero.showDiscount===undefined){ DATA.hero.showDiscount = true; }
  if(!DATA.logo){ DATA.logo = { image:'', size:40 }; }
  if(!DATA.partners){ DATA.partners = []; }
  if(!DATA.orders) DATA.orders=[];
  if(!DATA.customers) DATA.customers=[];
  if(DATA.currency !== 'TRY' && DATA.currency !== 'USD') DATA.currency = 'TRY';
  if(!DATA.usdRate || isNaN(DATA.usdRate) || DATA.usdRate <= 0) DATA.usdRate = 44.5;
  if(DATA.announcementEnabled === undefined) DATA.announcementEnabled = true;
  // STOK TAKİBİ: eski ürünlerde "stock" alanı hiç yoktu — bunlara null atayarak
  // "stok takibi yapılmıyor / sınırsız stok" anlamına geliyor. Admin bir ürüne stok
  // adedi girdiği andan itibaren o ürün için stok takibi devreye girer.
  DATA.products.forEach(p => { if(p.stock === undefined) p.stock = null; });
  if(!DATA.themeColor || !/^#[0-9a-fA-F]{6}$/.test(DATA.themeColor)) DATA.themeColor = '#2563eb';
  applyThemeColor(DATA.themeColor);
}
// ---------- tema rengi ----------
function hexToRgb(hex){
  hex = (hex||'#2563eb').replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0x2563eb;
  return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function mixWithWhite(hex, amount){ const {r,g,b}=hexToRgb(hex); return rgbToHex(r+(255-r)*amount, g+(255-g)*amount, b+(255-b)*amount); }
function mixWithBlack(hex, amount){ const {r,g,b}=hexToRgb(hex); return rgbToHex(r*(1-amount), g*(1-amount), b*(1-amount)); }
// Admin panelde seçilen TEK bir marka rengi (--amber), sitedeki tüm mavi vurguları
// (logo, butonlar, rozetler, sepet ikonu, duyuru bandı, gölgeler vb.) besliyor. Bu
// fonksiyon, seçilen renkten otomatik olarak açık/koyu tonlar ve rgba gölgeler için
// gereken "r,g,b" karşılığını türetip CSS değişkenlerine yazıyor — admin sadece TEK
// bir renk seçiyor, geri kalan tüm tonlar buradan otomatik hesaplanıyor.
function applyThemeColor(hex){
  if(!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return;
  const {r,g,b} = hexToRgb(hex);
  const root = document.documentElement.style;
  root.setProperty('--amber', hex);
  root.setProperty('--amber-rgb', `${r},${g},${b}`);
  root.setProperty('--amber-dim', mixWithWhite(hex, 0.86));
  root.setProperty('--amber-light', mixWithWhite(hex, 0.28));
  root.setProperty('--amber-dark', mixWithBlack(hex, 0.35));
  // Butonların hover/tıklama rengi (ör. "Sepete Ekle") eskiden sabit bir maviye
  // (#3b7ddb) kodlanmıştı; tema yeşil/kırmızı vb. olsa bile hep maviye dönüyordu.
  // Artık seçilen tema renginin biraz açık tonu kullanılıyor, böylece hover rengi
  // de tema rengine sadık kalıyor.
  root.setProperty('--amber-hover', mixWithWhite(hex, 0.18));
  // "Yeni" etiketleri, kullanıcı/profil ikonu, arama kutusu odak rengi gibi ikincil
  // vurgular ayrı bir "steel" tonu kullanıyordu ve tema rengiyle birlikte GÜNCELLENMİYORDU.
  // Artık --steel de seçilen marka renginden türetiliyor (biraz koyulaştırılmış hali),
  // böylece bu öğeler de tema rengine göre değişiyor.
  const steelHex = mixWithBlack(hex, 0.12);
  const {r:sr,g:sg,b:sb} = hexToRgb(steelHex);
  root.setProperty('--steel', steelHex);
  root.setProperty('--steel-rgb', `${sr},${sg},${sb}`);
}
// Bir ürünün stokta olup olmadığını hesaplar. stock null/undefined ise stok takibi
// yapılmıyor demektir — böyle ürünler her zaman "stokta" kabul edilir (eski davranış
// korunur, admin stok girmediği sürece hiçbir şey değişmez).
function inStock(p){ return p.stock === null || p.stock === undefined || p.stock > 0; }
function init(){
  // Anında açılış: önce (varsa) yerel önbellekten çiz, ağ isteğini beklemeden.
  try{
    const cached = localStorage.getItem('kdr_shared_'+STORAGE_KEY);
    DATA = cached ? JSON.parse(cached) : defaultData();
  }catch(e){ DATA = defaultData(); }
  normalizeData();
  try{
    const cartRaw = localStorage.getItem('kdr_local_'+CART_KEY);
    CART = cartRaw ? JSON.parse(cartRaw) : [];
  }catch(e){ CART = []; }
  render();
  loadData();
}
async function loadData(){
  const beforeJson = catalogComparable(DATA||{});
  try{
    const res = await storageGet(STORAGE_KEY, true);
    if(res && res.value){
      DATA = JSON.parse(res.value);
      // ÖNEMLİ: Firestore'dan taze veri geldiğinde yerel önbelleği (localStorage) de
      // hemen güncelliyoruz. Aksi halde önbellek sadece BU tarayıcıdan bir kayıt
      // (ürün ekleme/silme, sipariş vb.) yapıldığında güncelleniyordu — başka bir
      // cihazdan/sekmeden yapılan ürün değişiklikleri bu tarayıcının önbelleğine hiç
      // yazılmıyordu. Sonuç: sayfa her yenilendiğinde önce (varsa) günlerce eski kalmış
      // önbellek anlık olarak çizilip (ör. artık var olmayan veya "Yeni" işareti
      // kaldırılmış ürünler kısa süre görünüp), hemen ardından taze veri gelince o
      // ürünler ekrandan siliniyordu — "ürünler belirip kayboluyor" izlenimi buradan
      // geliyordu. Önbellek her yüklemede tazelenince bu "titreme" bir daha oluşmaz.
      try{ localStorage.setItem('kdr_shared_'+STORAGE_KEY, res.value); }catch(e){}
    }
    else if(!DATA){ DATA = defaultData(); await saveData(); }
  }catch(e){ if(!DATA) DATA = defaultData(); }
  normalizeData();
  lastCatalogCompareJson = catalogComparable(DATA);
  try{
    const cres = await storageGet(CART_KEY, false);
    CART = (cres && cres.value) ? JSON.parse(cres.value) : CART;
  }catch(e){ /* mevcut sepeti koru */ }
  const customerBefore = CUSTOMER ? CUSTOMER.id : null;
  await loadCustomerSession();
  const customerChanged = (CUSTOMER ? CUSTOMER.id : null) !== customerBefore;
  // İlk açılışta önbellekten çizilen sayfa ile Firestore'dan gelen taze veri birebir
  // aynıysa (çoğu durumda öyledir) ve oturum durumu da değişmediyse tekrar render()
  // çağırıp banner/kart animasyonlarının ikinci kez oynamasına (görünür "titremeye")
  // sebep olmuyoruz.
  if(customerChanged || catalogComparable(DATA) !== beforeJson){ render(); }
  startOrderWatcher();
  startOrdersColWatcher();
}
async function saveData(light){
  try{
    const json = JSON.stringify(DATA);
    const result = await storageSet(STORAGE_KEY, json, true, light ? {light:true} : undefined);
    if(!result){ showToast('Kaydetme başarısız oldu, tekrar deneyin'); }
    else if(result.cloudError){
      // Yerelde kaydedildi ama buluta (Firestore'a) yazılamadı — bu durumda başka bir
      // cihaz/tarayıcı bu değişikliği GÖRMEZ, o yüzden kullanıcıyı açıkça uyarıyoruz
      // (önceden bu sessizce yutuluyordu ve sorun fark edilemiyordu).
      const msg = String(result.cloudError.message||result.cloudError);
      showToast('Bulut kaydı başarısız: ' + msg.slice(0,120));
    }
  }
  catch(e){ console.error('save failed', e); showToast('Kaydetme hatası'); }
}

function money(n){
  // ÖNEMLİ: toLocaleString('tr-TR') varsayılan olarak ondalıklı sayılarda virgülden
  // sonra 3 basamağa kadar gösterebiliyordu (ör. 1166.667 → "1.166,667"). Türkçe
  // formatta nokta binlik ayracı olduğundan bu, gerçekte "bin yüz altmış altı virgül
  // altmış yedi" olan bir tutarı sanki "1 milyon 166 bin" gibi gösteriyordu — hesap
  // hatası değildi ama son derece yanıltıcıydı. Şimdi tüm tutarlar en yakın liraya
  // yuvarlanarak (ondalıksız) gösteriliyor; bu da sayfadaki diğer kartlarla (₺7.000
  // gibi) tutarlı ve tek bakışta yanlış anlaşılmaya kapalı.
  //
  // PARA BİRİMİ: tüm fiyatlar veritabanında HER ZAMAN TL olarak saklanır (ürün
  // fiyatı, sepet, sipariş, ciro — hepsi TL cinsinden hesaplanır). DATA.currency
  // 'USD' ise burada, gösterim anında, DATA.usdRate kuruna bölünüp $ işaretiyle
  // gösterilir. Yani admin "USD ile satış" moduna geçtiğinde hesaplamalar bozulmaz,
  // sadece ekrana yazdırma şekli değişir — tek doğru kaynak (TL) hep korunur.
  if(DATA && DATA.currency === 'USD'){
    const usd = Number(n) / (DATA.usdRate || 44.5);
    return '$' + usd.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  return '₺' + Math.round(Number(n)).toLocaleString('tr-TR', { maximumFractionDigits: 0, minimumFractionDigits: 0 });
}

function catLabel(p){ const sn = p.sub ? subName(p.category, p.sub) : ''; return catName(p.category) + (sn ? ' › ' + sn : ''); }
function catName(id){ const c = DATA.categories.find(c=>c.id===id); return c ? c.name : id; }
function catIcon(id){ const c = DATA && DATA.categories && DATA.categories.find(c=>c.id===id); if(c && c.icon) return c.icon; return CAT_ICONS[id] || '🔧'; }
function catImage(id){ const c = DATA && DATA.categories && DATA.categories.find(c=>c.id===id); return (c && c.image) ? c.image : ''; }
function catColor(id){ return CAT_COLORS[id] || '#eef1f5'; }
function esc(s){ return (s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function formatDate(iso){ const d=new Date(iso); return d.toLocaleDateString('tr-TR')+' '+d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }

/* ---------- uygulama içi onay penceresi: tarayıcının native confirm()'i yerine ---------- */
function appConfirm(message, confirmLabel){
  return new Promise(function(resolve){
    const overlay = document.createElement('div');
    overlay.className = 'overlay confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p>${esc(message)}</p>
        <div class="row">
          <button class="btn outline" data-act="cancel">Vazgeç</button>
          <button class="btn danger-outline" data-act="ok">${esc(confirmLabel||'Sil')}</button>
        </div>
      </div>`;
    function close(result){ overlay.remove(); document.removeEventListener('keydown', onKey); resolve(result); }
    function onKey(e){ if(e.key==='Escape') close(false); }
    overlay.addEventListener('click', function(e){ if(e.target===overlay) close(false); });
    overlay.querySelector('[data-act="cancel"]').addEventListener('click', function(){ close(false); });
    overlay.querySelector('[data-act="ok"]').addEventListener('click', function(){ close(true); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
  });
}

/* ---------- 3D tilt / grow hover effect on product cards ---------- */
function attachCardTilt(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('mousemove', onCardTiltMove);
    card.addEventListener('mouseleave', onCardTiltLeave);
  });
}
function onCardTiltMove(e){
  const card = e.currentTarget;
  const r = card.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width - 0.5;
  const py = (e.clientY - r.top) / r.height - 0.5;
  const rotY = px * 16;
  const rotX = -py * 16;
  card.style.transform = `perspective(900px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale3d(1.16,1.16,1.16) translateY(-26px)`;
}
function onCardTiltLeave(e){
  e.currentTarget.style.transform = '';
}

/* ---------- image upload ---------- */
/* Hedef: çözünürlüğü/kaliteyi olabildiğince yüksek tut, ama Firestore'un doküman
   başına 1MB (1.048.576 byte) sert limitini ASLA aşma.
   Önce büyük boyutta (maxDim'e göre) yüksek kalitede sıkıştırır, bütçeyi aşarsa
   kaliteyi kademeli düşürerek hedefe yaklaşır; kalite dibe vurursa boyutu küçültür.

   ÖNEMLİ: Bazı alanlar (Hero banner'daki 5 slayt fotoğrafı, 2 promosyon banner'ı,
   kategori simgeleri) aynı Firestore dokümanını PAYLAŞIR — yani o dokümandaki TÜM
   görsellerin toplamı 1MB'ın altında kalmalı, tek görsel değil. Bu yüzden hedef byte
   sayısı sabit değil: aynı dokümanı paylaşan, o an dolu olan görsel sayısına göre
   dinamik olarak paylaştırılıyor (az görsel = yüksek kalite, çok görsel = daha
   sıkı sıkıştırma). Yeni bir görsel eklendiğinde, aynı dokümandaki diğer görseller
   de yeni (daha düşük) paya göre otomatik olarak yeniden sıkıştırılır ki doküman
   asla 1MB sınırını aşıp sessizce kayıt hatası vermesin. */
// Firestore hata mesajı doküman sınırının ~1.048.487 byte olduğunu gösteriyor.
// ÖNEMLİ DÜZELTME: bütçe hesabı önceden görselin DECODE EDİLMİŞ (açılmış) byte
// boyutuna göre yapılıyordu — ama Firestore'a kaydedilen şey decode edilmiş görsel
// DEĞİL, base64 METNİNİN KENDİSİ (JSON içindeki "value" alanı). Base64 metni, decode
// edilmiş halinden ~%33 daha UZUN olduğu için (her 3 byte veri 4 karaktere kodlanır),
// "decode edilmiş 950KB" hedefiyle sıkıştırılan bir görsel aslında ~1.267KB'lık bir
// metin üretiyordu — bu da 1MB sınırını aşıp kayıt hatasına yol açıyordu. Şimdi
// hedefi doğrudan KAYDEDİLECEK METNİN UZUNLUĞUNA göre ölçüyoruz.
const DOC_BUDGET_BYTES = 900 * 1024; // ~900KB'lık base64 METİN bütçesi (1.048.487 byte sınırına karşı güvenli pay).
const IMG_TARGET_BYTES = DOC_BUDGET_BYTES; // tek görselli alanlar (ürün, logo vb.) için tavan.

// Firestore'a KAYDEDİLECEK gerçek boyut: base64 metninin kendi uzunluğu (ASCII
// karakterler olduğu için karakter sayısı ≈ byte sayısı). Sıkıştırma döngüsü ve
// bütçe kontrolleri bunu kullanmalı — aksi halde limit yanlış hesaplanır.
function storedStringBytes(dataUrl){ return dataUrl.length; }

function dataUrlBytes(dataUrl){
  // Kullanıcıya gösterilen "~XXX KB yüklendi" bilgisi için: görselin decode edilmiş
  // (gerçek dosya) boyutunun yaklaşık karşılığı. Bütçe/limit kontrolleri için
  // KULLANILMAMALI — onun için storedStringBytes() kullanılıyor.
  const b64 = dataUrl.split(',')[1] || '';
  return Math.round(b64.length * 0.75);
}

function compressToTarget(img, targetBytes){
  const target = targetBytes || IMG_TARGET_BYTES;
  // Adım 1: yüksek çözünürlüğü koru — sadece aşırı büyük fotoğrafları sınırla
  const maxDim = 3600; // yüksek çözünürlük üst sınırı (aşırı büyük fotoğraflar için)
  let w = img.width, h = img.height;
  if(w > maxDim || h > maxDim){
    if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
    else { w = Math.round(w * maxDim / h); h = maxDim; }
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let dataUrl = '';

  const render = (rw, rh) => {
    canvas.width = rw; canvas.height = rh;
    ctx.clearRect(0,0,rw,rh);
    ctx.drawImage(img, 0, 0, rw, rh);
  };

  render(w, h);

  // Adım 2: yüksek kaliteden başla, hedefin altındaysak kaliteyi düşürmeye gerek yok
  let quality = 0.97;
  dataUrl = canvas.toDataURL('image/jpeg', quality);
  while(storedStringBytes(dataUrl) > target && quality > 0.5){
    quality -= 0.06;
    dataUrl = canvas.toDataURL('image/jpeg', quality);
  }

  // Adım 3: kalite dibe vurduysa ve hâlâ hedefin üzerindeyse boyutu küçültmeye başla
  let tries = 0;
  while(storedStringBytes(dataUrl) > target && tries < 8){
    w = Math.round(w * 0.85); h = Math.round(h * 0.85);
    render(w, h);
    dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    tries++;
  }

  return dataUrl;
}

// Aynı Firestore dokümanını paylaşan diğer hidden-input id'lerini bulur
// (hero: h-img-0..4, promo: p-img-0..1, kategori: c-img-0..n). Diğer tüm
// alanlar (ürün fotoğrafı, logo vb.) tek başına kendi dokümanında olduğu
// için sadece kendi id'sini döndürür.
function siblingSlotIds(hiddenId){
  const m = hiddenId.match(/^([a-z]+)-img-(\d+)$/);
  if(!m) return [hiddenId];
  const prefix = m[1];
  if(prefix !== 'h' && prefix !== 'p' && prefix !== 'c') return [hiddenId];
  const ids = [];
  document.querySelectorAll(`input[type="hidden"][id^="${prefix}-img-"]`).forEach(el=>{
    if(new RegExp(`^${prefix}-img-\\d+$`).test(el.id)) ids.push(el.id);
  });
  return ids.length ? ids : [hiddenId];
}
function previewIdFor(hiddenId){
  const m = hiddenId.match(/^([a-z]+)-img-(\d+)$/);
  return m ? `${m[1]}-img-preview-${m[2]}` : null;
}
function isDataUrl(v){ return !!v && v.startsWith('data:'); }

// hiddenId için o an geçerli olan bütçeyi hesaplar: dokümanı paylaşan, o an
// dolu (base64) olan slotların sayısına göre bütçeyi eşit paylaştırır.
function currentBudgetFor(hiddenId){
  const ids = siblingSlotIds(hiddenId);
  if(ids.length <= 1) return DOC_BUDGET_BYTES;
  const filled = new Set(ids.filter(id=>{
    const el = document.getElementById(id);
    return el && isDataUrl(el.value);
  }));
  filled.add(hiddenId); // yeni yüklenecek görsel de bütçeye dahil
  return Math.max(Math.floor(DOC_BUDGET_BYTES / filled.size), 40 * 1024);
}

// Yeni bir görsel eklenince, aynı dokümanı paylaşan diğer görseller yeni
// (daha düşük) payın üzerindeyse sessizce yeniden sıkıştırır — böylece
// doküman toplamı her zaman 1MB sınırının altında kalır.
async function rebalanceSiblingImages(justUploadedId){
  const ids = siblingSlotIds(justUploadedId);
  if(ids.length <= 1) return;
  const filled = ids.filter(id=>{
    const el = document.getElementById(id);
    return el && isDataUrl(el.value);
  });
  if(filled.length <= 1) return;
  const budgetEach = Math.max(Math.floor(DOC_BUDGET_BYTES / filled.length), 40 * 1024);
  for(const id of filled){
    if(id === justUploadedId) continue; // bu zaten doğru bütçeyle sıkıştırıldı
    const el = document.getElementById(id);
    if(!el || storedStringBytes(el.value) <= budgetEach) continue;
    await new Promise(resolve=>{
      const img = new Image();
      img.onload = () => {
        el.value = compressToTarget(img, budgetEach);
        const pid = previewIdFor(id);
        const p = pid && document.getElementById(pid);
        if(p) p.style.backgroundImage = `url(${el.value})`;
        resolve();
      };
      img.onerror = resolve;
      img.src = el.value;
    });
  }
}

function handleImageFile(event, hiddenId, previewId){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Lütfen bir görsel dosyası seçin'); return; }
  const hidden = document.getElementById(hiddenId);
  const prev = document.getElementById(previewId);
  showToast('Fotoğraf işleniyor...');
  // Fotoğraf, hiçbir dış sunucuya/bulut hizmetine bağımlı olmadan doğrudan bu
  // tarayıcıda sıkıştırılıp Firestore dokümanına gömülüyor. Firebase Storage burada
  // KULLANILMIYOR çünkü ücretsiz (Spark) planda Storage etkin değil; ona bağımlı olmak
  // "Fotoğraf yükleniyor..." ekranında sonsuza dek takılı kalmaya yol açardı.
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = async () => {
      const budget = currentBudgetFor(hiddenId);
      const dataUrl = compressToTarget(img, budget);
      if(hidden) hidden.value = dataUrl;
      if(prev){ prev.style.backgroundImage = `url(${dataUrl})`; prev.textContent=''; }
      const kb = Math.round(dataUrlBytes(dataUrl)/1024);
      showToast(`Fotoğraf yüklendi (~${kb}KB)`);
      await rebalanceSiblingImages(hiddenId);
    };
    img.onerror = () => showToast('Görsel okunamadı, farklı bir dosya deneyin');
    img.src = e.target.result;
  };
  reader.onerror = () => showToast('Dosya okunamadı');
  reader.readAsDataURL(file);
}

function uploadWidget(hiddenId, previewId, urlId, currentValue, icon){
  const isHttp = currentValue && currentValue.startsWith('http');
  return `
  <div class="upload-row">
    <label>Fotoğraf</label>
    <div class="upload-flex">
      <div class="upload-preview" id="${previewId}" style="${currentValue?`background-image:url('${esc(currentValue)}')`:''}">${currentValue?'':icon}</div>
      <div class="upload-controls">
        <div class="upload-btn-row">
          <label class="btn small outline" for="${hiddenId}-file" style="cursor:pointer;">📁 Bilgisayardan Yükle</label>
          <input type="file" id="${hiddenId}-file" accept="image/*" style="display:none" onchange="handleImageFile(event,'${hiddenId}','${previewId}')">
          <button type="button" class="btn small outline" onclick="clearImage('${hiddenId}','${previewId}','${urlId}','${icon}')">Kaldır</button>
        </div>
        <input type="hidden" id="${hiddenId}" value="${esc(currentValue)}">
        <div class="upload-hint">JPG/PNG dosyanızı seçin; yüksek çözünürlük korunarak ~1MB'a kadar otomatik optimize edilir. Veya doğrudan görsel adresi yapıştırın:</div>
        <input type="url" id="${urlId}" value="${isHttp?esc(currentValue):''}" placeholder="https://..." style="margin-top:8px;"
          oninput="document.getElementById('${hiddenId}').value=this.value; updateImgPreviewFromUrl(this.value,'${previewId}')">
      </div>
    </div>
  </div>`;
}

function productImg(prod){
  const bg = catColor(prod.category);
  if(prod.image){
    return `<div class="card-img" style="background:${bg}"><img src="${esc(prod.image)}" onerror="this.parentElement.textContent='${catIcon(prod.category)}'; this.parentElement.style.fontSize='54px';"></div>`;
  }
  return `<div class="card-img" style="background:${bg}">${catIcon(prod.category)}</div>`;
}
function productCard(prod){
  let badges = '';
  const out = !inStock(prod);
  if(out) badges += '<div class="ribbon" style="background:#6b7280;">Stokta Yok</div>';
  else if(prod.isNew) badges += '<div class="ribbon new">Yeni</div>';
  if(prod.salePrice){
    const pct = prod.price > 0 ? Math.round((1 - prod.salePrice/prod.price)*100) : 0;
    badges += `<div class="ribbon sale"${(out||prod.isNew)?' style="top:38px;"':''}>%${pct} İndirim</div>`;
  }
  const priceHtml = prod.salePrice
    ? `<span class="price strike">${money(prod.price)}</span><span class="price sale">${money(prod.salePrice)}</span>`
    : `<span class="price">${money(prod.price)}</span>`;
  return `
  <div class="card" onclick="openProduct('${prod.id}')">
    <div class="card-clip">
      ${badges}
      ${productImg(prod)}
      <div class="card-body">
        <div class="card-cat">${esc(catLabel(prod))}</div>
        <div class="card-name">${esc(prod.name)}</div>
        <div class="price-row">${priceHtml}</div>
      </div>
    </div>
    <div class="card-quick"><div class="card-quick-inner">
      ${out
        ? `<button class="btn small" disabled style="opacity:.55; cursor:not-allowed;" onclick="event.stopPropagation();">Stokta Yok</button>`
        : `<button class="btn small" onclick="event.stopPropagation(); addToCart('${prod.id}',1);">Sepete Ekle</button>`}
    </div></div>
  </div>`;
}
function grid(products){
  if(!products.length) return `<div class="empty">Bu bölümde henüz ürün yok.</div>`;
  return `<div class="grid">${products.map(productCard).join('')}</div>`;
}

// Not: sepetteki bir ürün kataloğundan silinmiş/kaldırılmış olabilir (ör. yönetim
// panelinden ürün silindi ya da başka bir cihazda katalog değişti). Böyle "hayalet"
// kayıtlar burada CART dizisinden temizlenir; aksi halde sepet ikonundaki sayaç
// (ham CART.qty toplamı) ile sepet penceresinde gösterilen ürünler (yalnızca hâlâ
// katalogda bulunanlar) birbirinden farklı sayılara denk gelir — "sayaçta 2 var ama
// sepet boş görünüyor" hatasına yol açar.
function findSellable(id){
  if(typeof id === 'string' && id.indexOf('sub:') === 0){
    const subId = id.slice(4);
    for(const c of DATA.categories){
      const sc = (c.subs||[]).find(x=>x.id===subId);
      if(sc){
        if(sc.price===null || sc.price===undefined || sc.price==='' || !(sc.price>0)) return null;
        return { id, name: c.name + ' › ' + sc.name, category:c.id, sub:sc.id, price:Number(sc.price), salePrice:null,
                 image:sc.image||'', stock:(sc.stock===undefined?null:sc.stock), _sub:sc };
      }
    }
    return null;
  }
  return DATA.products.find(p=>p.id===id) || null;
}
function pruneGhostCartItems(){
  if(!DATA || !DATA.products) return;
  const before = CART.length;
  CART = CART.filter(c => !!findSellable(c.productId));
  if(CART.length !== before) saveCart();
}
function cartCount(){ pruneGhostCartItems(); return CART.reduce((s,i)=>s+i.qty,0); }
function cartItemsResolved(){
  pruneGhostCartItems();
  return CART.map(c=>{
    const p = findSellable(c.productId);
    if(!p) return null;
    const unit = p.salePrice || p.price;
    return { ...p, qty:c.qty, unit, lineTotal: unit*c.qty };
  }).filter(Boolean);
}
function cartTotal(){ return cartItemsResolved().reduce((s,i)=>s+i.lineTotal,0); }

function logoMarkup(size){

  const src = (DATA.logo && DATA.logo.image) ? DATA.logo.image : DEFAULT_LOGO_IMG;
  return `<img src="${esc(src)}" style="height:${s}px; width:auto; max-width:${s*5}px; object-fit:contain; display:block;" onerror="this.outerHTML='<div class=&quot;hex&quot;>5S</div>'">`;

    </div>
    ${hasImg && n>1 ? `
    <div class="hero-dots">${images.map((_,i)=>`<button class="hero-dot${i===HERO_IDX?' active':''}" onclick="heroGoTo(${i})"></button>`).join('')}</div>
    `:''}
  </div>`;
}
let HERO_IDX = 0;
let HERO_TIMER = null;
function heroSlide(dir){
  const n = heroImages().length;
  if(n<2) return;
  HERO_IDX = (HERO_IDX + dir + n) % n;
  updateHeroSlidePosition();
  restartHeroAutoplay();
}
function heroGoTo(i){
  const n = heroImages().length;
  if(n<2) return;
  HERO_IDX = ((i % n) + n) % n;
  updateHeroSlidePosition();
  restartHeroAutoplay();
}
function updateHeroSlidePosition(){
  const track = document.getElementById('heroSlides');
  if(!track) return;
  const n = heroImages().length;
  track.style.transform = `translateX(-${HERO_IDX*(100/n)}%)`;
  document.querySelectorAll('#heroSlider .hero-dot').forEach((d,i)=>d.classList.toggle('active', i===HERO_IDX));
}
function restartHeroAutoplay(){
  if(HERO_TIMER) clearInterval(HERO_TIMER);
  const n = heroImages().length;
  if(n<2) return;
  HERO_TIMER = setInterval(()=>{ heroSlide(1); }, 5000);
}
function setupHeroSlider(){
  const el = document.getElementById('heroSlider');
  if(!el) { if(HERO_TIMER){ clearInterval(HERO_TIMER); HERO_TIMER=null; } return; }
  restartHeroAutoplay();
  let touchStartX = null;
  el.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(touchStartX==null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){ heroSlide(dx < 0 ? 1 : -1); }
    touchStartX = null;
  }, {passive:true});
  el.addEventListener('mouseenter', ()=>{ if(HERO_TIMER) clearInterval(HERO_TIMER); });
  el.addEventListener('mouseleave', ()=>{ restartHeroAutoplay(); });
}

function openAccount(){ ACCOUNT.open=true; ACCOUNT.step = CUSTOMER ? 'profile' : 'start'; ACCOUNT.tab='profil'; render(); }

function setAccountTab(tab){ ACCOUNT.tab=tab; render(); }

function goLogin(){ ACCOUNT.step='login'; render(); }
function goRegister(){ ACCOUNT.step='register'; render(); }
function backToStart(){ ACCOUNT.step='start'; render(); }

async function doRegister(){
  const name = document.getElementById('acc-name').value.trim();
  const surname = document.getElementById('acc-surname').value.trim();
  const email = document.getElementById('acc-email').value.trim().toLowerCase();
  const password = document.getElementById('acc-password').value;
  const password2 = document.getElementById('acc-password2').value;
  const phone = document.getElementById('acc-phone').value.trim();
  const address = document.getElementById('acc-address').value.trim();
  if(!name || !surname || !email || !password || !phone || !address){ showToast('Lütfen tüm alanları doldurun'); return; }
  if(!email.includes('@') || !email.includes('.')){ showToast('Geçerli bir e-posta adresi girin'); return; }
  if(password.length < 6){ showToast('Şifre en az 6 karakter olmalı'); return; }
  if(password !== password2){ showToast('Şifreler eşleşmiyor'); return; }
  if(!DATA.customers) DATA.customers = [];
  if(DATA.customers.some(c=>c.email.toLowerCase()===email)){ showToast('Bu e-posta ile zaten bir hesap var, giriş yapın'); return; }
  const customer = {
    id: uuid(),
    name, surname, email, password,
    phone, address,
    createdAt: new Date().toISOString()
  };
  DATA.customers.push(customer);
  CUSTOMER = customer;
  ACCOUNT.step='profile'; ACCOUNT.tab='profil';
  render();
  showToast('Kayıt tamamlandı, hoş geldiniz ' + name + '!');
  saveCustomerSession();
  saveData(true);   // arka planda, sadece müşteri/ayar belgesini yazar (ürünlere dokunmaz)
}

async function doLogin(){
  const email = document.getElementById('acc-login-email').value.trim().toLowerCase();
  const password = document.getElementById('acc-login-password').value;
  if(!email || !password){ showToast('E-posta ve şifrenizi girin'); return; }
  const found = (DATA.customers||[]).find(c=>c.email.toLowerCase()===email && c.password===password);
  if(!found){ showToast('E-posta veya şifre hatalı'); return; }
  CUSTOMER = found;
  await saveCustomerSession();
  ACCOUNT.step='profile'; ACCOUNT.tab='profil';
  render();
  showToast('Giriş yapıldı, hoş geldiniz ' + found.name + '!');
}

async function saveProfileEdits(){
  if(!CUSTOMER) return;
  CUSTOMER.phone = document.getElementById('acc-edit-phone').value.trim();
  CUSTOMER.address = document.getElementById('acc-edit-address').value.trim();
  render();
  showToast('Bilgileriniz güncellendi');
  saveData(true);
}

async function logoutCustomer(){
  if(!(await appConfirm('Çıkış yapmak istediğinize emin misiniz?', 'Çıkış Yap'))) return;
  CUSTOMER = null;
  await saveCustomerSession();

// Türkçe karakter düzeltmesi: JS'in varsayılan toLowerCase() fonksiyonu Türkçe
// büyük "İ" harfini küçültürken görünmez bir "combining dot" karakteri ekliyor
// (İ → i̇, sadece "i" değil). Bu yüzden "İP Kamera" gibi bir ürün adında normal
// "ip" metni aramak sonuç VERMİYORDU — arada gözle görünmeyen fazladan bir işaret
// kalıyordu. Bu fonksiyon önce İ/I/ı gibi tüm Türkçe "i" varyantlarını tek bir
// karaktere indirger, ardından ğ/ü/ş/ö/ç gibi harfleri de sade karşılıklarına
// çevirir — böylece kullanıcı Türkçe klavye kullanmasa bile (ör. "guvenlik"
// yazsa da "Güvenlik" ürünü bulunur) arama güvenilir şekilde çalışır.
function turkishFold(str){
  return String(str)
    .replace(/[İIı]/g, 'i')
    .toLowerCase()
    .replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function searchProducts(term){
  VIEW.searchTerm = term;
  if(!term.trim()){
    VIEW.page='home'; VIEW.category=null; VIEW.searchResults=null;
    render();
    return;
  }
  VIEW.page='category'; VIEW.category='__search';
  // ÖNEMLİ: Önceden tüm arama metni TEK BİR bitişik parça olarak aranıyordu
  // (ör. "dahua ip"), bu yüzden kelimeler ürün adında bitişik/sırayla geçmiyorsa
  // (ör. "Dahua 4MP IP Bullet Kamera" — "dahua" ile "ip" arasında başka kelimeler
  // var) eşleşme kuruluyor ve ürün BULUNAMIYORDU. Bu, "bazen buluyor bazen
  // bulamıyor" hissinin asıl nedeniydi: tek kelimeyle arama çoğunlukla çalışıyor,
  // iki-üç kelime yazınca genelde başarısız oluyordu. Şimdi yazılan metin
  // kelimelere bölünüyor ve HER kelimenin (sırası/bitişikliği önemli olmadan)
  // ürün adının veya kategori adının bir yerinde geçmesi yeterli sayılıyor.
  const words = turkishFold(term).trim().split(/\s+/).filter(Boolean);
  VIEW.searchResults = DATA.products.filter(p => {
    const haystack = turkishFold(p.name) + ' ' + turkishFold(catLabel(p));
    return words.every(w => haystack.includes(w));
  });
  render();
  const input = document.getElementById('search-input');
  if(input){ input.focus(); const v=input.value; input.value=''; input.value=v; }
}

function ensureSubDrop(){
  let d = document.getElementById('subdrop');

    d.addEventListener('mouseenter', ()=>clearTimeout(SUBMENU.timer));

}
function openSubMenu(catId, btn){
  const c = DATA.categories.find(c=>c.id===catId);
  if(!c || !(c.subs||[]).length){ closeSubMenu(); return; }
  clearTimeout(SUBMENU.timer);
  const d = ensureSubDrop();
  d.innerHTML = `<button class="all ${VIEW.category===c.id && !VIEW.sub?'active':''}" onclick="goCategory('${c.id}')">Tüm ${esc(c.name)}</button>` +
    c.subs.map(sc=>`<button class="${VIEW.category===c.id && VIEW.sub===sc.id?'active':''}" onclick="goCategory('${c.id}','${sc.id}')">${esc(sc.name)}</button>`).join('');
  const r = btn.getBoundingClientRect();
  d.style.top = (r.bottom + 4) + 'px';
  d.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 220)) + 'px';
  d.classList.add('open');
  SUBMENU.catId = catId;
}
function closeSubMenu(){ const d = document.getElementById('subdrop'); if(d) d.classList.remove('open'); SUBMENU.catId = null; }
function subHoverOpen(catId, btn){ if(CAN_HOVER) openSubMenu(catId, btn); }
function subHoverLeave(){ if(!CAN_HOVER) return; clearTimeout(SUBMENU.timer); SUBMENU.timer = setTimeout(closeSubMenu, 180); }
function navCatClick(catId, btn){

}

function addToCart(id, qty){
  qty = qty || 1;
  const prod = findSellable(id);
  if(!prod || !inStock(prod)){ showToast('Bu ürün stokta yok'); return; }
  const existing = CART.find(c=>c.productId===id);
  const alreadyInCart = existing ? existing.qty : 0;
  if(prod.stock !== null && prod.stock !== undefined && alreadyInCart + qty > prod.stock){
    const kalan = Math.max(prod.stock - alreadyInCart, 0);
    showToast(kalan > 0 ? `Stokta sadece ${kalan} adet kaldı` : 'Bu üründen sepetinizde zaten stoktaki tüm adetler var');
    return;
  }
  if(existing) existing.qty += qty; else CART.push({productId:id, qty});
  VIEW.product = null;
  saveCart(); render(); showToast('Sepete eklendi');
}
function removeFromCart(id){ CART = CART.filter(c=>c.productId!==id); saveCart(); render(); }
function changeQty(id, delta){
  const item = CART.find(c=>c.productId===id);
  if(!item) return;
  if(delta > 0){
    const prod = findSellable(id);
    if(prod && prod.stock !== null && prod.stock !== undefined && item.qty + delta > prod.stock){
      showToast(`Stokta sadece ${prod.stock} adet var`);
      return;
    }
  }
  item.qty += delta;
  if(item.qty<=0){ CART = CART.filter(c=>c.productId!==id); }
  saveCart(); render();
}
async function clearCart(){
  if(!(await appConfirm('Sepeti boşaltmak istediğinize emin misiniz?', 'Boşalt'))) return;
  CART=[]; saveCart(); render();
}
function placeOrder(){
  const items = cartItemsResolved();
  if(!items.length) return;
  if(!CUSTOMER){
    showToast('Siparişi tamamlamak için lütfen giriş yapın ya da kayıt olun');
    VIEW.cartOpen=false;
    ACCOUNT.open=true; ACCOUNT.step='start'; ACCOUNT.tab='profil';
    render();
    return;
  }
  // Stok güvenlik kontrolü: sepetteki bir ürün, sepete eklendikten sonra (başka bir
  // cihazdan/sekmeden) stoktan düşmüş olabilir. Siparişi kesinleştirmeden hemen önce
  // son bir kez kontrol ediyoruz ki stokta olmayan bir ürün asla sipariş edilmesin.
  for(const i of items){
    const p = findSellable(i.id);
    if(p && p.stock !== null && p.stock !== undefined && i.qty > p.stock){
      showToast(`"${p.name}" için stokta yeterli adet kalmadı (kalan: ${Math.max(p.stock,0)}). Lütfen sepetinizi güncelleyin.`);
      render();
      return;
    }
  }
  const order = {
    id: uuid(), date: new Date().toISOString(),
    items: items.map(i=>({ id:i.id, name:i.name, qty:i.qty, price:i.unit, category:i.category, image:i.image||'' })),
    total: cartTotal(),
    status: 'beklemede',
    customerId: CUSTOMER ? CUSTOMER.id : null,
    customerName: CUSTOMER ? (CUSTOMER.name+' '+CUSTOMER.surname) : '',
    customerEmail: CUSTOMER ? CUSTOMER.email : '',
    customerPhone: CUSTOMER ? CUSTOMER.phone : '',
    customerAddress: CUSTOMER ? CUSTOMER.address : ''
  };
  if(!DATA.orders) DATA.orders=[];
  DATA.orders.unshift(order);
  // STOK DÜŞÜRME: her satılan ürün için, o üründe stok takibi açıksa (stock bir sayı
  // ise, null değilse) satılan adet kadar stoktan düş. 0'ın altına inmesin diye
  // Math.max ile sıfırda sabitliyoruz. Bu satış anında hangi ürünlerin YENİ yeni
  // stoğu tükendiğini (önceden >0 iken şimdi 0'a düşenleri) ayrıca not ediyoruz ki
  // yönetime haber verelim.
  const justRanOut = [];
  for(const i of items){
    const p = findSellable(i.id);
    if(p && p.stock !== null && p.stock !== undefined){
      const before = p.stock;
      p.stock = Math.max(0, p.stock - i.qty);
      if(p._sub) p._sub.stock = p.stock;   // alt kategori stoğunu gerçek kayda geri yaz
      if(before > 0 && p.stock === 0) justRanOut.push(p.name);
    }
  }
  saveOrdersLocalOnly();
  syncOrderToFirestore(order);
  if(justRanOut.length) saveData();
  if(NOTIF.enabled){
    fireOrderNotification(order);
    NOTIF.lastOrderId = order.id; localStorage.setItem('kdr-notif-last-order', order.id);
    justRanOut.forEach(name => fireStockOutNotification(name));
  }
  CART=[]; saveCart();
  VIEW.cartOpen=false;
  render();
  showToast(CUSTOMER ? 'Siparişiniz alındı! "Siparişlerim" bölümünden takip edebilirsiniz.' : 'Siparişiniz alındı! Sipariş takibi için hesap oluşturabilirsiniz.');
}

function render(){
  const active = document.activeElement;
  const focusId = active && active.id;
  let selStart=null, selEnd=null;
  if(focusId && (active.tagName==='INPUT'||active.tagName==='TEXTAREA')){
    try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){}
  }
  // Yönetim panelindeki içerik (.admin-main) kendi scroll'una sahip. render() her
  // çağrıldığında app.innerHTML tamamen yeniden yazıldığı için bu eleman da baştan
  // oluşturuluyor ve tarayıcı scroll konumunu otomatik olarak sıfırlıyor (en üste
  // atıyor). Örn. sipariş listesinde "Onayla"/"Hazır" butonuna basınca sayfanın
  // zıplaması bundan kaynaklanıyordu — burada scroll konumunu kaydedip yeniden
  // çizimden sonra geri yüklüyoruz.
  const prevAdminMain = document.querySelector('.admin-main');
  const adminScrollTop = prevAdminMain ? prevAdminMain.scrollTop : null;
  const winScrollY = window.scrollY;
  const app = document.getElementById('app');
  let body = VIEW.page==='home' ? homeView() : categoryView();
  app.innerHTML = `
    ${headerHtml()}
    <main>${body}</main>
    ${footerHtml()}
    ${VIEW.product ? productModal() : ''}
    ${VIEW.cartOpen ? cartModal() : ''}
    ${ACCOUNT.open ? accountModal() : ''}
    ${ADMIN.open ? adminHtml() : ''}
    ${LIGHTBOX_IMG ? lightboxHtml() : ''}
  `;
  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
  if(adminScrollTop!=null){
    const newAdminMain = document.querySelector('.admin-main');
    if(newAdminMain) newAdminMain.scrollTop = adminScrollTop;
  } else {
    window.scrollTo(0, winScrollY);
  }
  attachCardTilt();
  setupHeroSlider();
}

function toggleOnSale(checked){
  const fields = document.getElementById('f-discount-fields');
  const pctEl = document.getElementById('f-discpct');
  const saleEl = document.getElementById('f-sale');
  if(checked){
    fields.style.display = '';
    if(!pctEl.value.trim() && !saleEl.value.trim()){
      pctEl.value = 10;
      syncSaleFromPct();
    }
  } else {
    fields.style.display = 'none';
    pctEl.value = '';
    saleEl.value = '';
  }
}
function syncSaleFromPct(){
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const pctEl = document.getElementById('f-discpct');
  const pct = parseFloat(pctEl.value);
  const saleEl = document.getElementById('f-sale');
  if(!pctEl.value.trim() || isNaN(pct)){ return; }
  if(price>0){ saleEl.value = Math.round(price * (1 - pct/100)); }
}
function syncPctFromSale(){
  const price = parseFloat(document.getElementById('f-price').value) || 0;
  const saleEl = document.getElementById('f-sale');
  const sale = parseFloat(saleEl.value);
  const pctEl = document.getElementById('f-discpct');
  if(!saleEl.value.trim() || isNaN(sale)){ pctEl.value=''; return; }
  if(price>0){ pctEl.value = Math.round((1 - sale/price)*100); }
}
function syncDiscountFromPrice(){
  const pctEl = document.getElementById('f-discpct');
  if(pctEl.value.trim()){ syncSaleFromPct(); }
  else { syncPctFromSale(); }
}

function svgBarChart(labels, values, opts){
  opts = opts || {};
  const W = opts.width || 720, H = opts.height || 260;
  const padL = 54, padB = 34, padT = 16, padR = 16;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const maxV = Math.max(1, ...values);
  const n = values.length;
  const gap = n > 0 ? chartW / n : chartW;
  const barW = Math.max(6, gap * 0.55);
  const gridLines = 4;
  let gridSvg = '';
  for(let g=0; g<=gridLines; g++){
    const y = padT + chartH - (chartH * g/gridLines);
    const val = Math.round(maxV * g/gridLines);
    gridSvg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-8}" y="${y+4}" font-size="10" fill="var(--muted)" text-anchor="end">${val>=1000?Math.round(val/1000)+'B':val}</text>`;
  }
  let bars = '';
  values.forEach((v,i)=>{
    const bh = maxV>0 ? (v/maxV) * chartH : 0;
    const x = padL + gap*i + (gap-barW)/2;
    const y = padT + chartH - bh;
    bars += `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="var(--amber)"><title>${esc(labels[i])}: ${money(v)}</title></rect>`;
    bars += `<text x="${x+barW/2}" y="${padT+chartH+18}" font-size="10" fill="var(--muted)" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; max-width:${W}px;">${gridSvg}${bars}</svg>`;
}
function adminReports(){
  const orders = DATA.orders || [];
  const totalRevenue = orders.reduce((s,o)=>s+(o.total||0),0);
  const totalItemsSold = orders.reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+i.qty,0),0);
  const totalOrders = orders.length;
  const avgOrder = totalOrders ? totalRevenue/totalOrders : 0;

  // Aylık: son 12 ay
  const now = new Date();
  const monthLabels = [], monthRevenue = [], monthItems = [];
  for(let i=11; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = d.getFullYear()+'-'+d.getMonth();
    monthLabels.push(d.toLocaleDateString('tr-TR', {month:'short', year:'2-digit'}));
    let rev = 0, items = 0;
    orders.forEach(o=>{
      const od = new Date(o.date);
      if(od.getFullYear()===d.getFullYear() && od.getMonth()===d.getMonth()){ rev += o.total||0; items += o.items.reduce((s,i)=>s+i.qty,0); }
    });
    monthRevenue.push(rev); monthItems.push(items);
  }

  // Yıllık: siparişlerin kapsadığı tüm yıllar
  const years = Array.from(new Set(orders.map(o=>new Date(o.date).getFullYear()))).sort();
  const yearLabels = years.length ? years.map(String) : [String(now.getFullYear())];
  const yearRevenue = yearLabels.map(y=>orders.filter(o=>new Date(o.date).getFullYear()===parseInt(y)).reduce((s,o)=>s+(o.total||0),0));
  const yearItems = yearLabels.map(y=>orders.filter(o=>new Date(o.date).getFullYear()===parseInt(y)).reduce((s,o)=>s+o.items.reduce((s2,i)=>s2+i.qty,0),0));

  const isMonthly = ADMIN.reportView !== 'yearly';
  const labels = isMonthly ? monthLabels : yearLabels;
  const revenueVals = isMonthly ? monthRevenue : yearRevenue;
  const itemVals = isMonthly ? monthItems : yearItems;
  const periodRevenue = revenueVals[revenueVals.length-1] || 0;
  const periodItems = itemVals[itemVals.length-1] || 0;

  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="n">${money(totalRevenue)}</div><div class="l">Toplam Ciro (tüm zamanlar)</div></div>
    <div class="stat-card"><div class="n">${totalItemsSold}</div><div class="l">Toplam Satılan Ürün Adedi</div></div>
    <div class="stat-card"><div class="n">${totalOrders}</div><div class="l">Toplam Sipariş</div></div>
    <div class="stat-card"><div class="n">${money(avgOrder)}</div><div class="l">Ortalama Sipariş Tutarı</div></div>
  </div>
  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
      <h3 style="margin:0;">Ciro Grafiği</h3>
      <div style="display:flex; gap:8px;">
        <button class="btn small ${isMonthly?'':'outline'}" onclick="setReportView('monthly')">Aylık (Son 12 Ay)</button>
        <button class="btn small ${isMonthly?'outline':''}" onclick="setReportView('yearly')">Yıllık</button>
      </div>

function editProduct(id){

  ADMIN.sidebarOpen = false;
  render();
  // render() yönetim panelinin kaydırma konumunu korur; form listenin en üstünde açıldığı için

  window.scrollTo(0,0);

function newProductIn(catId, subId){
  ADMIN.tab = 'urunler'; ADMIN.newPreset = { category:catId, sub:subId||'' }; ADMIN.editingProduct = 'new';
  render();
  const m = document.querySelector('.admin-main'); if(m) m.scrollTop = 0;

}
function setProductStock(id, val){
  const p = DATA.products.find(p=>p.id===id);
  if(!p) return;
  val = String(val).trim();
  p.stock = val === '' ? null : Math.max(0, parseInt(val,10) || 0);
  saveData();
  showToast(p.stock === null ? 'Stok takibi kapatıldı (sınırsız)' : (p.stock === 0 ? 'Stok 0: ürün "Stokta Yok" oldu' : 'Stok güncellendi: ' + p.stock));
}
function subImgId(i, j){
  let k = 0; for(let a=0; a<i; a++) k += (DATA.categories[a].subs||[]).length;
  return 'c-img-' + (100 + k + j);   // 'c-img-N' kalıbı: kategori görselleriyle aynı Firestore belge bütçesini paylaşır
}
function saveSubDetails(i, j){
  const sc = DATA.categories[i].subs[j];
  const img = document.getElementById(subImgId(i,j));
  const priceRaw = document.getElementById(`sub-price-${i}-${j}`).value.trim();
  const stockRaw = document.getElementById(`sub-stock-${i}-${j}`).value.trim();
  sc.image = img ? img.value.trim() : (sc.image||'');
  sc.description = document.getElementById(`sub-desc-${i}-${j}`).value.trim();
  sc.price = priceRaw === '' ? null : Math.max(0, parseFloat(priceRaw) || 0);
  sc.stock = stockRaw === '' ? null : Math.max(0, parseInt(stockRaw,10) || 0);
  saveData(); render(); showToast('Alt kategori kaydedildi');
}
function renameSub(i, j, val){ val=val.trim(); if(!val) return; DATA.categories[i].subs[j].name = val; saveData(); showToast('Alt kategori güncellendi'); }
function addSub(i){
  const input = document.getElementById('new-sub-'+i);
  const name = input.value.trim();
  if(!name) return;
  const c = DATA.categories[i];
  if(!Array.isArray(c.subs)) c.subs = [];
  const id = 's-' + name.toLowerCase().replace(/[^a-z0-9ığüşöç]+/gi,'-') + '-' + Date.now().toString(36).slice(-4);
  c.subs.push({id, name, image:'', description:'', price:null, stock:null});
  saveData(); render(); showToast('Alt kategori eklendi');
}
async function deleteSub(i, j){
  const c = DATA.categories[i]; const sc = c.subs[j];
  const used = DATA.products.filter(p=>p.category===c.id && p.sub===sc.id);
  const msg = used.length ? `Bu alt kategoride ${used.length} ürün var. Silerseniz ürünler "${c.name}" kategorisinde alt kategorisiz kalır. Devam edilsin mi?` : 'Alt kategoriyi silmek istediğinize emin misiniz?';
  if(!(await appConfirm(msg, 'Sil'))) return;
  used.forEach(p=>{ p.sub = ''; });
  c.subs.splice(j,1);
  if(VIEW.category===c.id && VIEW.sub===sc.id) VIEW.sub = null;
  saveData(); render(); showToast('Alt kategori silindi');
}

      <span>Mavi duyuru bandını sitede göster</span>
    </label>
    <div class="hint" style="margin-top:6px;">Kapatırsanız üstteki mavi kayan yazı şeridi sitede hiç görünmez, metin silinmez — istediğiniz an tekrar açabilirsiniz.</div>
    <button class="btn" style="margin-top:18px;" onclick="saveSettings()">Kaydet</button>
  </div>
  <div class="panel">
    <h3>💱 Para Birimi</h3>
    <div class="hint">Ürün fiyatları her zaman TL olarak girilir/saklanır. Buradan "USD ile Satış" seçerseniz, sitedeki (ve yönetim panelindeki) TÜM fiyatlar, aşağıdaki kur üzerinden anlık olarak dolara çevrilip gösterilir — istediğiniz an tekrar TL'ye dönebilirsiniz, hiçbir fiyatı yeniden girmenize gerek kalmaz.</div>
    <div style="display:flex; gap:10px; margin-top:14px;">
      <button type="button" onclick="document.getElementById('s-currency').value='TRY'; renderCurrencyChoice();" id="s-cur-try" class="btn${DATA.currency==='USD' ? ' outline' : ''}" style="flex:1;">₺ TL ile Satış</button>
      <button type="button" onclick="document.getElementById('s-currency').value='USD'; renderCurrencyChoice();" id="s-cur-usd" class="btn${DATA.currency==='USD' ? '' : ' outline'}" style="flex:1;">$ USD ile Satış</button>
    </div>
    <input type="hidden" id="s-currency" value="${DATA.currency}">
    <label style="margin-top:16px;">Dolar Kuru (1 USD = ? TL)</label>
    <input type="number" id="s-usdrate" value="${DATA.usdRate}" step="0.01" min="0.01" placeholder="Örn: 44.50">
    <div class="hint" style="margin-top:6px;">Bu kuru güncel piyasa kuruna göre siz güncellersiniz — site otomatik çekmez. Örnek: 1000 TL'lik bir ürün, kur 44,50 iken $22.47 olarak gösterilir.</div>
    <button class="btn" style="margin-top:18px;" onclick="saveCurrency()">Para Birimi Ayarlarını Kaydet</button>
  </div>
  <div class="panel">
    <h3>🎨 Tema Rengi</h3>
    <div class="hint">Sitedeki tüm mavi vurguları (logo, butonlar, rozetler, sepet ikonu, duyuru bandı vb.) tek bir renk belirler. İstediğiniz rengi seçin — açık/koyu tonlar otomatik hesaplanır.</div>
    <div style="display:flex; align-items:center; gap:14px; margin-top:14px;">
      <input type="color" id="s-theme-picker" value="${DATA.themeColor}" oninput="document.getElementById('s-theme-hex').value=this.value.toUpperCase(); applyThemeColor(this.value);" style="width:56px; height:56px; padding:0; border:2px solid var(--line); border-radius:10px; cursor:pointer; background:none;">
      <div style="flex:1;">
        <label>Hex Kod</label>
        <input type="text" id="s-theme-hex" value="${DATA.themeColor.toUpperCase()}" placeholder="#2563EB" maxlength="7" oninput="if(/^#[0-9a-fA-F]{6}$/.test(this.value)){ document.getElementById('s-theme-picker').value=this.value; applyThemeColor(this.value); }">
      </div>
    </div>
    <div class="hint" style="margin-top:8px;">Renk seçtiğiniz anda üstteki önizleme canlı olarak değişir — beğenmezseniz sayfayı yenileyip vazgeçebilirsiniz. Beğendiyseniz kaydedin.</div>
    <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
      ${['#2563eb','#dc2626','#16a34a','#ea580c','#7c3aed','#0891b2','#db2777','#171b22'].map(c=>`<button type="button" title="${c}" onclick="document.getElementById('s-theme-picker').value='${c}'; document.getElementById('s-theme-hex').value='${c.toUpperCase()}'; applyThemeColor('${c}');" style="width:32px; height:32px; border-radius:50%; background:${c}; border:2px solid var(--line); cursor:pointer;"></button>`).join('')}
    </div>
    <button class="btn" style="margin-top:18px;" onclick="saveThemeColor()">Tema Rengini Kaydet</button>
  </div>
  <div class="panel">
    <h3>🔔 Sipariş Bildirimleri</h3>
    <div class="hint">Bir müşteri sipariş verdiğinde bu tarayıcıda (Windows üzerinde Chrome, Edge, Firefox vb.) masaüstü bildirimi almak için etkinleştirin.</div>
    <div class="hint" style="margin-top:8px;">Önemli: İzin ve "açık/kapalı" durumu sadece kullandığınız tarayıcıya kayıtlıdır. Bildirimleri hem Chrome'da hem Firefox'ta almak istiyorsanız her ikisinde de ayrı ayrı "Etkinleştir" butonuna basmanız gerekir. Ayrıca bildirimlerin gelebilmesi için site o tarayıcıda bir sekmede açık kalmalı (simge durumuna küçültülmüş/arka planda olabilir, ama tarayıcı tamamen kapalıyken bildirim gelmez).</div>
    <p style="margin-top:12px; font-size:13px; font-weight:600;">${notifStatusLabel()}</p>
    ${NOTIF.enabled && notifSupported() && Notification.permission==='granted'
      ? `<div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
           <button class="btn danger-outline" onclick="disableNotifications()">Bildirimleri Kapat</button>
           <button class="btn outline" onclick="sendTestNotification()">🔔 Test Bildirimi Gönder</button>
         </div>
         <div class="hint" style="margin-top:8px;">Test bildirimi gelmiyorsa sorun bu sitede değil, tarayıcınızın veya işletim sisteminizin (Windows/macOS) bildirim ayarlarındadır — bu sitenin bildirim izni engellenmiş ya da "Rahatsız Etmeyin" modu açık olabilir.</div>`
      : `<button class="btn" style="margin-top:14px;" onclick="enableNotifications()">🔔 Bildirimleri Etkinleştir</button>`}
  </div>
  <div class="panel">
    <h3>Verileri Sıfırla</h3>
    <div class="hint">Tüm ürünleri, bannerları, siparişleri ve ayarları varsayılan demo verilerine döndürür. Bu işlem geri alınamaz.</div>
    <button class="btn danger-outline" onclick="resetAll()">Varsayılanlara Sıfırla</button>
  </div>`;
}
function saveLogo(){
  const image = document.getElementById('s-logo-img').value.trim();
  const size = parseInt(document.getElementById('s-logo-size').value, 10) || 40;
  DATA.logo = { image, size };
  saveData(); render(); showToast('Logo kaydedildi');
}
function renderCurrencyChoice(){
  const v = document.getElementById('s-currency').value;
  const tryBtn = document.getElementById('s-cur-try');
  const usdBtn = document.getElementById('s-cur-usd');
  if(!tryBtn || !usdBtn) return;
  tryBtn.classList.toggle('outline', v === 'USD');
  usdBtn.classList.toggle('outline', v !== 'USD');
}
function saveThemeColor(){
  const hex = document.getElementById('s-theme-hex').value.trim();
  if(!/^#[0-9a-fA-F]{6}$/.test(hex)){ showToast('Geçerli bir hex renk kodu girin (ör. #2563EB)'); return; }
  DATA.themeColor = hex;
  applyThemeColor(hex);
  saveData(); render(); showToast('Tema rengi kaydedildi');
}
function saveCurrency(){
  const currency = document.getElementById('s-currency').value === 'USD' ? 'USD' : 'TRY';
  const rate = parseFloat(document.getElementById('s-usdrate').value);
  if(!rate || rate <= 0){ showToast('Geçerli bir dolar kuru girin'); return; }
  DATA.currency = currency;
  DATA.usdRate = rate;
  saveData(); render();
  showToast(currency === 'USD' ? 'Artık USD ile satış yapılıyor' : 'Artık TL ile satış yapılıyor');
}
function saveSettings(){
  DATA.siteName = document.getElementById('s-name').value;
  DATA.announcement = document.getElementById('s-announce').value;
  DATA.announcementEnabled = document.getElementById('s-announce-enabled').checked;
  saveData(); render(); showToast('Ayarlar kaydedildi');
}
async function resetAll(){
  if(!(await appConfirm('Tüm veriler sıfırlanacak. Emin misiniz?', 'Sıfırla'))) return;
  DATA = defaultData();
  saveData();
  clearAllOrdersFromFirestore();
  render(); showToast('Veriler sıfırlandı');
}

init();
</script>
</body>
</html>
